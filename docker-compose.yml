services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev_password
      POSTGRES_DB: inventorytrack
    ports:
      - "5432:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorytrack"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  inventory_data:
